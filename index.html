<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra beställning</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  /* Layout: una columna estrecha, pensada para móvil; cabecera tipo formulario impreso. Vistas: acceso > datos > firma > listo, más historial y usuarios. */
  :root{
    --paper:#e9eff5;
    --card:#ffffff;
    --ink:#0a1f33;
    --muted:#566371;
    --line:#bfcad6;
    --accent:#062849; /* azul ISS (aprox. #062849, ver brandcolorcode.com/iss-a-s) */
    --accent-ink:#ffffff;
    --danger:#b3261e;
    --ok:#1b6b39;
    --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
    --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
    padding:20px 16px 48px;
  }
  .wrap{max-width:640px;margin:0 auto}
  header{border-top:6px solid var(--accent);border-bottom:2px solid var(--accent);padding:14px 0 12px;margin-bottom:18px}
  h1{color:var(--accent);font-family:var(--display);font-weight:700;font-size:clamp(34px,9vw,48px);line-height:1;margin:0;letter-spacing:.01em;text-transform:uppercase}
  header p{margin:6px 0 0;color:var(--muted)}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 10px}
  .vtag{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.06em;color:var(--muted)}
  .lang{margin:0}
  .updbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:#fff7dd;border:2px solid #d9bd55;border-radius:6px;padding:10px 12px;margin:0 0 14px}
  .updbar span{flex:1 1 200px;font-weight:600}
  .updbar button{min-height:42px;font-size:17px;padding:6px 16px}
  .ver{margin-top:6px;font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted)}
  .ver.old{color:var(--danger);font-weight:600}
  .ver .status{margin:4px 0 0;min-height:0;font-size:13px}
  .seg{display:flex}
  .seg button{min-height:38px;padding:2px 12px;font-size:16px;border-radius:0}
  .seg button+button{border-left-width:0}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .tabs{margin:0 0 16px}
  .tabs button{flex:1;font-size:17px;padding:4px 6px;min-height:44px}
  .note{font-size:14px;color:var(--muted)}
  .toplinks{display:flex;gap:6px 18px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
  .who{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto}
  .who small{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.04em;background:var(--accent);color:var(--accent-ink);border-radius:3px;padding:1px 6px;margin-left:6px;vertical-align:middle}
  .folder,.lnk{color:var(--accent);font-weight:600}
  button.lnk{border:0;background:none;padding:0;min-height:0;font-family:var(--body);font-size:16px;letter-spacing:0;text-transform:none;text-decoration:underline;cursor:pointer}
  ul.hist{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
  ul.hist li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:4px;padding:10px 12px;background:#f7fafc}
  .hi{min-width:0}
  .hi b{font-family:var(--display);font-size:21px;letter-spacing:.04em;color:var(--accent)}
  .hi span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  ul.hist li button{min-height:42px;font-size:17px;padding:6px 14px;flex:none}
  .steps{display:flex;gap:8px;margin:0 0 18px;padding:0;list-style:none;font-family:var(--display);font-weight:600;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
  .steps li{flex:1;padding:6px 0;border-bottom:3px solid var(--line);color:var(--muted)}
  .steps li.on{border-color:var(--accent);color:var(--ink)}
  .steps li.done{border-color:var(--ink);color:var(--ink)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;min-width:0}
  label,.lbl{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase}
  .opt{font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:0;text-transform:none;color:var(--muted);margin-left:6px}
  input,textarea{
    width:100%;font:inherit;color:var(--ink);background:#f7fafc;border:1px solid var(--line);border-radius:4px;padding:11px 12px;
  }
  textarea{min-height:120px;resize:vertical}
  input:focus,textarea:focus,button:focus-visible{outline:3px solid #7fb2e5;outline-offset:1px;border-color:var(--accent)}
  .field.bad input,.field.bad textarea{border-color:var(--danger);background:#fff6f5}
  .err{color:var(--danger);font-size:14px;min-height:0}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:420px){.row2{grid-template-columns:1fr}}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  button{
    font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.05em;text-transform:uppercase;
    border-radius:4px;border:2px solid var(--ink);padding:11px 20px;cursor:pointer;background:var(--card);color:var(--ink);min-height:48px;
  }
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1 1 220px}
  button:disabled{opacity:.55;cursor:default}
  dl.sum{margin:0 0 18px;display:grid;grid-template-columns:max-content 1fr;gap:6px 14px}
  dl.sum dt{font-family:var(--display);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  dl.sum dd{margin:0;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
  .handoff{background:#fff7dd;border:1px solid #e3cf8a;border-radius:4px;padding:10px 12px;margin:0 0 16px;font-size:15px}
  .sigbox{position:relative;border:1px solid var(--ink);border-radius:4px;background:#fff;touch-action:none}
  .sigbox canvas{display:block;width:100%;height:190px;touch-action:none;cursor:crosshair}
  .sigbox .hint{position:absolute;left:12px;bottom:34px;right:12px;border-bottom:1px dashed var(--line);pointer-events:none}
  .sigbox .hint span{position:absolute;left:0;top:6px;font-size:13px;color:var(--muted)}
  .status{margin:14px 0 0;min-height:1.4em;color:var(--muted)}
  .status.error{color:var(--danger)}
  .done-mark{font-family:var(--display);font-weight:700;font-size:34px;text-transform:uppercase;color:var(--ok);margin:0 0 6px}
  a.link{display:inline-block;margin:6px 0 16px;color:var(--accent);font-weight:600;overflow-wrap:anywhere}
  footer{margin-top:22px;border-top:2px solid var(--accent);padding-top:10px;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:15px;color:var(--muted)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar">
      <span class="vtag" id="vtag"></span>
      <div class="lang seg" role="group" aria-label="Språk / Idioma">
        <button type="button" data-lang="sv" aria-pressed="true">SV</button>
        <button type="button" data-lang="es" aria-pressed="false">ES</button>
      </div>
    </div>
    <h1>Extra beställning</h1>
    <p data-i18n="sub"></p>
  </header>

  <!-- aviso de versión nueva -->
  <div class="updbar" id="updbar" hidden>
    <span id="updText"></span>
    <button type="button" class="primary" id="updBtn" data-i18n="updBtn"></button>
  </div>
  <div class="updbar" id="srvWarn" hidden><span data-i18n="srvOld"></span></div>

  <!-- barra de sesión (solo con sesión iniciada) -->
  <div class="toplinks" id="toplinks" hidden>
    <span class="who" id="who"></span>
    <button type="button" class="lnk" id="newBtn" data-i18n="newOrder"></button>
    <button type="button" class="lnk" id="histBtn" data-i18n="hist"></button>
    <button type="button" class="lnk" id="usersBtn" data-i18n="usersBtn" hidden></button>
    <a class="folder" id="folderLink" href="#" target="_blank" rel="noopener" hidden data-i18n="folder"></a>
    <button type="button" class="lnk" id="logoutBtn" data-i18n="logout"></button>
  </div>

  <!-- ACCESO -->
  <section id="sA" class="panel">
    <div class="tabs seg" role="group" id="tabs">
      <button type="button" data-mode="login" aria-pressed="true" data-i18n="tabLogin"></button>
      <button type="button" data-mode="register" aria-pressed="false" data-i18n="tabReg"></button>
      <button type="button" data-mode="admin" aria-pressed="false" data-i18n="tabAdmin"></button>
    </div>
    <form id="aForm" novalidate>
      <p class="note" id="aHint" hidden data-i18n="hintReg"></p>
      <div class="field" id="g_code" hidden>
        <label for="a_code" data-i18n="fUserCode"></label>
        <input id="a_code" type="password" autocomplete="off">
      </div>
      <div class="field" id="g_name" hidden>
        <label for="a_name" data-i18n="fFullName"></label>
        <input id="a_name" autocomplete="name" maxlength="80">
      </div>
      <div class="field" id="g_user">
        <label for="a_user" data-i18n="fUser"></label>
        <input id="a_user" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30">
      </div>
      <div class="field" id="g_pass">
        <label for="a_pass" data-i18n="fPass"></label>
        <input id="a_pass" type="password" autocomplete="current-password" maxlength="100">
      </div>
      <div class="field" id="g_pass2" hidden>
        <label for="a_pass2" data-i18n="fPass2"></label>
        <input id="a_pass2" type="password" autocomplete="new-password" maxlength="100">
      </div>
      <div class="field" id="g_admin" hidden>
        <label for="a_admin" data-i18n="fAdminCode"></label>
        <input id="a_admin" type="password" autocomplete="off">
      </div>
      <div class="actions">
        <button type="submit" class="primary" id="aGo" data-i18n="bLogin"></button>
      </div>
      <p class="status" id="astatus" role="status"></p>
    </form>
  </section>

  <ol class="steps" id="steps" hidden>
    <li id="st1" class="on" data-i18n="st1"></li>
    <li id="st2" data-i18n="st2"></li>
    <li id="st3" data-i18n="st3"></li>
  </ol>

  <!-- PASO 1: datos -->
  <section id="s1" class="panel" hidden>
    <form id="form" novalidate></form>
    <div class="actions">
      <button type="button" class="primary" id="toSign" data-i18n="next"></button>
    </div>
  </section>

  <!-- PASO 2: firma del responsable -->
  <section id="s2" class="panel" hidden>
    <p class="handoff" data-i18n="handoff"></p>
    <dl class="sum" id="sum"></dl>

    <div class="field">
      <span class="lbl" data-i18n="sig"></span>
      <div class="sigbox">
        <canvas id="sig"></canvas>
        <div class="hint"><span data-i18n="sigHint"></span></div>
      </div>
      <div class="err" id="sigErr"></div>
    </div>

    <div class="field">
      <label for="ansvarig"><span data-i18n="ansv"></span> <span class="opt" data-i18n="ansvOpt"></span></label>
      <input id="ansvarig" autocomplete="off">
    </div>
    <div class="row2">
      <div class="field"><label for="datum" data-i18n="datum"></label><input id="datum" type="date"></div>
      <div class="field"><label for="tid" data-i18n="tid"></label><input id="tid" type="time"></div>
    </div>

    <div class="actions">
      <button type="button" id="back" data-i18n="back"></button>
      <button type="button" id="clear" data-i18n="clear"></button>
      <button type="button" class="primary" id="save" data-i18n="save"></button>
    </div>
    <p class="status" id="status" role="status"></p>
  </section>

  <!-- PASO 3: listo -->
  <section id="s3" class="panel" hidden>
    <p class="done-mark" data-i18n="done"></p>
    <p data-i18n="doneMsg"></p>
    <div class="actions"><button type="button" id="pdfOpen" data-i18n="open"></button></div>
    <p class="status" id="dstatus" role="status"></p>
    <div class="actions"><button type="button" class="primary" id="again" data-i18n="again"></button></div>
  </section>

  <!-- HISTORIAL: PDF guardados (cada usuario ve los suyos; el administrador, todos) -->
  <section id="s4" class="panel" hidden>
    <p class="note" id="scopeNote"></p>
    <div class="field">
      <label for="hq" data-i18n="search"></label>
      <input id="hq" type="search" autocomplete="off">
    </div>
    <div class="actions">
      <button type="button" id="hrefresh" data-i18n="refresh"></button>
      <button type="button" class="primary" id="hback" data-i18n="again"></button>
    </div>
    <p class="status" id="hstatus" role="status"></p>
    <ul class="hist" id="hlist"></ul>
  </section>

  <!-- USUARIOS (solo administrador) -->
  <section id="s5" class="panel" hidden>
    <p class="note" data-i18n="usersNote"></p>
    <div class="actions">
      <button type="button" id="urefresh" data-i18n="refresh"></button>
      <button type="button" class="primary" id="uback" data-i18n="again"></button>
    </div>
    <p class="status" id="ustatus" role="status"></p>
    <ul class="hist" id="ulist"></ul>
  </section>

  <footer>
    <span data-i18n="footer"></span>
    <div class="ver" id="ver">
      <span id="verText"></span> ·
      <button type="button" class="lnk" id="verCheck" data-i18n="verCheck"></button>
      <p class="status" id="verMsg" role="status"></p>
    </div>
  </footer>
</div>

<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

let session = null;      // {token, user, name, role}
try{ session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
function apiUrl(){
  const u = (window.CONFIG && window.CONFIG.APPS_SCRIPT_URL) || '';
  return /^https:\/\/script\.google\.com\//.test(u) ? u : '';
}
function api(payload){
  const body = Object.assign({}, payload);
  if(session && !['login','register','admin'].includes(body.action)) body.token = session.token;
  return fetch(apiUrl(), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},   // evita el preflight CORS
    body: JSON.stringify(body)
  }).then(r => r.json()).then(res=>{
    if(res && res.auth && session){ logout(); setMsg('#astatus', t('err_AUTH'), true); }
    return res;
  });
}
function errText(x){
  if(x && x.ok === false) return (x.code && t('err_' + x.code)) || x.error || t('unknown');
  return t('offline');
}
function setMsg(sel, msg, isErr){
  const s = $(sel); if(!s) return;
  s.textContent = msg; s.className = 'status' + (isErr ? ' error' : '');
}

let authMode = 'login';
function setAuthMode(m){
  authMode = m;
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  const show = {
    g_code: m==='register', g_name: m==='register', g_user: m!=='admin',
    g_pass: m!=='admin', g_pass2: m==='register', g_admin: m==='admin', aHint: m==='register'
  };
  Object.keys(show).forEach(id=>{ $('#'+id).hidden = !show[id]; });
  $('#a_pass').autocomplete = m==='register' ? 'new-password' : 'current-password';
  const key = {login:'bLogin', register:'bReg', admin:'bAdmin'}[m];
  $('#aGo').dataset.i18n = key; $('#aGo').textContent = t(key);
  setMsg('#astatus','');
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click', ()=>setAuthMode(b.dataset.mode)));
$('#aForm').addEventListener('submit', e=>{ e.preventDefault(); doAuth(); });
function doAuth(){
  if(!apiUrl()){ setMsg('#astatus', t('eUrl'), true); return; }
  const user = $('#a_user').value.trim(), pass = $('#a_pass').value;
  let payload;
  if(authMode === 'login'){
    if(!user || !pass){ setMsg('#astatus', t('eFill'), true); return; }
    payload = {action:'login', user, pass};
  }else if(authMode === 'register'){
    const code = $('#a_code').value, name = $('#a_name').value.trim(), pass2 = $('#a_pass2').value;
    if(!code || !name || !user || !pass || !pass2){ setMsg('#astatus', t('eFill'), true); return; }
    if(pass !== pass2){ setMsg('#astatus', t('eMatch'), true); return; }
    payload = {action:'register', code, name, user, pass};
  }else{
    const code = $('#a_admin').value;
    if(!code){ setMsg('#astatus', t('eFill'), true); return; }
    payload = {action:'admin', code};
  }
  const btn = $('#aGo'); btn.disabled = true;
  setMsg('#astatus', t('loading'));
  api(payload).then(res=>{
    btn.disabled = false;
    if(!res.ok){ setMsg('#astatus', errText(res), true); return; }
    session = {token:res.token, user:res.user, name:res.name, role:res.role};
    try{ localStorage.setItem(SESSION_KEY, JSON.stringify(session)); }catch(e){}
    ['a_code','a_name','a_user','a_pass','a_pass2','a_admin'].forEach(id=>{ $('#'+id).value = ''; });
    setMsg('#astatus','');
    enterApp();
  }).catch(err=>{ btn.disabled = false; setMsg('#astatus', errText(err), true); });
}

/* ---------- firma ---------- */
const pad = {ctx:null, drawing:false, ink:false, dpr:1, b:null};
function resetBounds(){ pad.b = {x0:1e9,y0:1e9,x1:-1,y1:-1}; }
function setupPad(){
  const c = $('#sig');
  const r = c.getBoundingClientRect();
  pad.dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = Math.round(r.width*pad.dpr);
  c.height = Math.round(r.height*pad.dpr);
  const x = c.getContext('2d');
  x.setTransform(pad.dpr,0,0,pad.dpr,0,0);
  x.lineWidth = 2.6; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#111';
  pad.ctx = x; pad.ink = false; resetBounds();
  $('#sigErr').textContent = '';
}
function pos(e){
  const r = $('#sig').getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function grow(p){
  const b = pad.b;
  b.x0 = Math.min(b.x0,p.x); b.y0 = Math.min(b.y0,p.y);
  b.x1 = Math.max(b.x1,p.x); b.y1 = Math.max(b.y1,p.y);
}
(function bindPad(){
  const c = $('#sig');
  c.addEventListener('pointerdown', e=>{
    if(!pad.ctx) return;
    e.preventDefault();
    c.setPointerCapture(e.pointerId);
    pad.drawing = true;
    const p = pos(e);
    pad.ctx.beginPath(); pad.ctx.moveTo(p.x,p.y); pad.ctx.lineTo(p.x+0.01,p.y); pad.ctx.stroke();
    pad.ink = true; grow(p);
    $('#sigErr').textContent = '';
  });
  c.addEventListener('pointermove', e=>{
    if(!pad.drawing) return;
    e.preventDefault();
    const p = pos(e);
    pad.ctx.lineTo(p.x,p.y); pad.ctx.stroke();
    pad.ctx.beginPath(); pad.ctx.moveTo(p.x,p.y);
    grow(p);
  });
  const end = ()=>{ pad.drawing = false; };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('pointerleave', end);
  $('#clear').addEventListener('click', setupPad);
})();
function signatureImage(){
  // recorta la firma a su caja de trazos
  const c = $('#sig'), b = pad.b, m = 8, d = pad.dpr;
  const x0 = Math.max(0,(b.x0-m)*d), y0 = Math.max(0,(b.y0-m)*d);
  const x1 = Math.min(c.width,(b.x1+m)*d), y1 = Math.min(c.height,(b.y1+m)*d);
  const w = Math.max(1,Math.round(x1-x0)), h = Math.max(1,Math.round(y1-y0));
  const o = document.createElement('canvas');
  o.width = w; o.height = h;
  o.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, w, h);
  return {url:o.toDataURL('image/png'), w:w, h:h};
}

/* ---------- PDF (siempre en sueco, independiente del idioma de la interfaz) ---------- */
function buildPdf(d, sig){
  const jsPDF = window.jspdf.jsPDF;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const L = 18, R = 192, X = 72;
  const NAVY = [6, 40, 73];                       // azul ISS (aprox.)
  const navy = ()=>{ doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]); doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]); };
  const black = ()=>doc.setTextColor(0,0,0);
  const grey = ()=>doc.setDrawColor(130,142,155);

  navy(); doc.setFillColor(NAVY[0],NAVY[1],NAVY[2]);
  doc.rect(0, 0, 210, 6, 'F');                    // franja superior
  doc.setFont('helvetica','bold'); doc.setFontSize(26);
  doc.text('EXTRA BESTÄLLNING', L, 26);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(70,82,95);
  doc.text('Vänligen fyll i alla uppgifter tydligt. Tack!', L, 33);
  navy(); doc.setLineWidth(0.6); doc.line(L, 38, R, 38);

  let y = 50;
  const line = (label, value)=>{
    navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(label, L, y);
    black(); doc.setFont('helvetica','normal'); doc.setFontSize(11);
    if(value) doc.text(String(value), X, y - 0.8, {maxWidth: R - X});
    grey(); doc.setLineWidth(0.2); doc.line(X - 2, y + 1.4, R, y + 1.4);
    y += 11;
  };
  line('NAMN:', d.namn);
  line('HSA-ID:', d.hsa);
  line('TELEFON:', d.telefon);
  line('E-POST:', d.epost);
  line('AVDELNING:', d.avdelning);
  line('KOSTNADSSTÄLLE:', d.kostnadsstalle);
  line('RUMSNUMMER:', d.rumsnummer);
  line('KARMNUMMER:', d.karmnummer);

  // Beställning: caja que crece con el texto
  navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('BESTÄLLNING:', L, y + 2);
  black(); doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const lines = doc.splitTextToSize(d.bestallning, R - X - 6);
  const boxH = Math.max(34, lines.length * 5.2 + 8);
  navy(); doc.setLineWidth(0.3); doc.rect(X - 2, y - 4, R - X + 2, boxH);
  black(); doc.text(lines, X + 1, y + 2);
  y += boxH + 10;

  // Underskrift
  navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('UNDERSKRIFT:', L, y);
  const maxW = 70, maxH = 22;
  const k = Math.min(maxW / sig.w, maxH / sig.h);
  const sw = sig.w * k, sh = sig.h * k;
  doc.addImage(sig.url, 'PNG', X, y + 1.4 - sh, sw, sh);
  grey(); doc.setLineWidth(0.2); doc.line(X - 2, y + 1.4, R, y + 1.4);
  if(d.ansvarig){
    black(); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(d.ansvarig, X, y + 6);
  }
  y += 13;
  line('DATUM:', d.datum);
  line('TID:', d.tid);

  navy(); doc.setLineWidth(0.6); doc.line(L, 270, R, 270);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('TACK FÖR ATT DU BIDRAR TILL EN REN OCH TRIVSAM MILJÖ!', L, 277);
  return doc;
}

/* ---------- nombre de archivo: iniciales + fecha ---------- */
function initials(name){
  const ini = String(name||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .split(/[\s\-]+/).filter(w=>!/^(de|del|la|las|los|y|van|von|af|da|di)$/i.test(w)).map(w=>w.replace(/[^A-Za-z]/g,'').charAt(0)).join('').toUpperCase();
  return (ini || 'XX').slice(0,4);
}
function fileNameFor(d){
  return `${initials(d.namn)}_${d.datum}_${d.tid.replace(':','')}.pdf`;   // ej. JCP_2026-10-20_2115.pdf
}

/* ---------- abrir PDF guardados ---------- */
// Pide el PDF al servidor y lo muestra en una pestaña nueva
function openPdf(fileId, btn, statusSel){
  if(!apiUrl()){ setMsg(statusSel, t('eUrl'), true); return; }
  const w = window.open('', '_blank');           // se abre ya, durante el toque, para que no lo bloqueen
  if(btn) btn.disabled = true;
  setMsg(statusSel, t('loading'));
  api({action:'pdf', id:fileId}).then(res=>{
    if(btn) btn.disabled = false;
    if(!res.ok) throw res;
    const bytes = Uint8Array.from(atob(res.pdfBase64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
    if(w){ w.location.href = url; setMsg(statusSel, ''); }
    else{
      const s = $(statusSel); s.className = 'status'; s.textContent = '';
      const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('popup');
      s.appendChild(a);
    }
  }).catch(err=>{
    if(w) w.close();
    if(btn) btn.disabled = false;
    setMsg(statusSel, t('hErr') + errText(err), true);
  });
}

    <button type="button" data-u="${esc(u.user)}">${esc(t('deleteBtn'))}</button></li>`).join('');
}
function loadUsers(){
  setMsg('#ustatus', t('loading')); $('#ulist').innerHTML = '';
  api({action:'users'}).then(res=>{
    if(!res.ok) throw res;
    usersData = res.items || [];
    setMsg('#ustatus','');
    renderUsers();
  }).catch(err=>{ setMsg('#ustatus', t('hErr') + errText(err), true); });
}
$('#usersBtn').addEventListener('click', ()=>{ showView('s5'); loadUsers(); });
$('#urefresh').addEventListener('click', loadUsers);
$('#ulist').addEventListener('click', e=>{
  const b = e.target.closest('button[data-u]');
  if(!b) return;
  if(!b.dataset.armed){          // primer toque: pide confirmación en el propio botón
    b.dataset.armed = '1'; b.textContent = t('confirmBtn');
    setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = t('deleteBtn'); } }, 4000);
    return;
  }
  b.disabled = true;
  api({action:'deluser', user:b.dataset.u}).then(res=>{
    if(!res.ok) throw res;
    loadUsers();
  }).catch(err=>{ b.disabled = false; setMsg('#ustatus', t('hErr') + errText(err), true); });
});

/* ---------- guardar pedido ---------- */
$('#save').addEventListener('click', ()=>{
  if(!pad.ink){ $('#sigErr').textContent = t('eSig'); return; }
  if(!$('#datum').value || !$('#tid').value){ setMsg('#status', t('eDT'), true); return; }
  if(!window.jspdf){ setMsg('#status', t('eLib'), true); return; }
  if(!apiUrl()){ setMsg('#status', t('eUrl'), true); return; }
  const d = Object.assign({}, current, {
    ansvarig: $('#ansvarig').value.trim(),
    datum: $('#datum').value,
    tid: $('#tid').value
  });
  const btn = $('#save'); btn.disabled = true;
  setMsg('#status', t('mkPdf'));
  let payload;
  try{
    const doc = buildPdf(d, signatureImage());
    const b64 = doc.output('datauristring').split(',')[1];
    payload = {fields:d, fileName:fileNameFor(d), pdfBase64:b64};
  }catch(err){
    btn.disabled = false; setMsg('#status', t('ePdf') + err.message, true); return;
  }
  setMsg('#status', t('saving'));
  api(payload).then(res=>{
    btn.disabled = false;
    if(!res.ok){ setMsg('#status', t('notSaved') + errText(res), true); return; }
    lastSavedId = res.fileId || '';
    try{ if(res.folder) localStorage.setItem(FOLDER_KEY, res.folder); }catch(e){}
    showFolderLinks();
    setMsg('#dstatus','');
    showView('s3');
  }).catch(err=>{ btn.disabled = false; setMsg('#status', errText(err), true); });
});

/* ---------- versión y actualización automática ---------- */
let pendingVersion = '';
let serverVersion = '';
function currentView(){ return VIEWS.find(v=>!$('#'+v).hidden) || ''; }
// No recargar si hay algo a medias (formulario, firma, contraseña escrita o guardando)
function isBusy(){
  const v = currentView();
  if($('#save').disabled || $('#aGo').disabled) return true;
  if(v === 's2') return true;
  if(v === 's1') return !!($('#bestallning').value.trim() || $('#rumsnummer').value.trim() || $('#karmnummer').value.trim());
  if(v === 'sA') return ['a_code','a_name','a_user','a_pass','a_pass2','a_admin'].some(id=>$('#'+id).value);
  return false;
}
function goTo(url){ location.replace(url); }
function renderVer(){
  const outdated = !!serverVersion && serverVersion !== EXPECTED_SERVER;
  $('#vtag').textContent = 'v' + APP_VERSION;
  $('#verText').textContent = `${t('verApp')} v${APP_VERSION} · ${t('verSrv')} ${serverVersion ? 'v' + serverVersion : '—'}` + (outdated ? ` (${t('old')})` : '');
  $('#ver').classList.toggle('old', outdated);
  $('#srvWarn').hidden = !(outdated && isAdmin());
  if(pendingVersion) $('#updText').textContent = t('updText') + pendingVersion;
}
function latestVersion(){
  // Lee el propio index.html sin caché y extrae APP_VERSION: una sola fuente de verdad
  const u = new URL('index.html', location.href);
  u.search = ''; u.searchParams.set('_', Date.now());
  return fetch(u.toString(), {cache:'no-store'}).then(r=>r.text()).then(txt=>{
    const m = /const APP_VERSION = '(\d[^']*)'/.exec(txt);
    return m ? m[1] : null;
  });
}
function applyUpdate(){
  if(!pendingVersion) return;
  if(new URLSearchParams(location.search).get('v') === pendingVersion){
    // ya se intentó con esta versión y el servidor aún entrega la anterior: no entrar en bucle
    setMsg('#verMsg', t('updWait'), true);
    return;
  }
  const u = new URL(location.href);
  u.searchParams.set('v', pendingVersion);   // URL distinta = el navegador pide el archivo nuevo, sin borrar caché
  goTo(u.toString());
}
function checkUpdate(manual){
  if(manual) setMsg('#verMsg', t('verChecking'));
  return latestVersion().then(v=>{
    if(v && v !== APP_VERSION){
      pendingVersion = v;
      $('#updbar').hidden = false;
      renderVer();
      if(!isBusy()) applyUpdate();
    }else{
      pendingVersion = ''; $('#updbar').hidden = true;
      if(manual) setMsg('#verMsg', t('verOk'));
    }
  }).catch(()=>{ if(manual) setMsg('#verMsg', t('offline'), true); });
}
function checkServer(){
  if(!apiUrl()) return;
  fetch(apiUrl()).then(r=>r.json()).then(j=>{ serverVersion = (j && j.version) || '0'; renderVer(); }).catch(()=>{});
}
$('#updBtn').addEventListener('click', applyUpdate);
$('#verCheck').addEventListener('click', ()=>{ checkServer(); checkUpdate(true); });
let lastCheck = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && Date.now() - lastCheck > 60000){ lastCheck = Date.now(); checkUpdate(false); checkServer(); }
});
setInterval(()=>{ lastCheck = Date.now(); checkUpdate(false); }, 5 * 60 * 1000);

/* ---------- arranque ---------- */
buildForm();
setAuthMode('login');
applyLang();
if(session && session.token) enterApp(); else showView('sA');
renderVer();
lastCheck = Date.now(); checkUpdate(false); checkServer();
</script>
