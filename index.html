<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Extra beställning</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Extra">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" as="image" href="assets/iss-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<script>
  /* La pantalla de logo solo sale al abrir la app, no al recargar por una actualización */
  (function(){
    try{
      var skip = sessionStorage.getItem('extra-splash') === '1' || /[?&]v=/.test(location.search);
      sessionStorage.setItem('extra-splash', '1');
      if(skip) document.documentElement.classList.add('nosplash');
    }catch(e){}
  })();
</script>
<style>
  /*
   * Dirección: rotulación de hospital. Azul exacto del logo ISS sobre blanco y gris azulado,
   * pictogramas como los del formulario en papel, menú lateral azul con el logo sobre placa blanca.
   * Móvil: barra superior + menú que se desliza. Tablet: igual, con formulario a dos columnas.
   * Escritorio (900 px o más): menú fijo a la izquierda, firma a dos columnas.
   */
  :root{
    --navy:#0D132D;          /* azul del logo */
    --navy-2:#1A2247;
    --navy-3:#2B3569;
    --bg:#F1F3F8;
    --surface:#FFFFFF;
    --line:#D9DEE9;
    --line-strong:#9EA8C0;
    --text:#0D132D;
    --muted:#566079;
    --on-navy:#E8EBF6;
    --on-navy-muted:#A6AECB;
    --focus:#2F6BDB;
    --ok:#1E7A46;
    --danger:#B3261E;
    --warn-bg:#FFF5D9;
    --warn-line:#E2C766;
    --display:'Archivo','Arial Narrow','Helvetica Neue',Arial,sans-serif;
    --body:'Atkinson Hyperlegible','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    --r-panel:10px;
    --r-ctl:6px;
    --nav-w:280px;
  }
  *{box-sizing:border-box}
  html{color-scheme:light;-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.5 var(--body)}
  button,input,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  [hidden]{display:none!important}
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
  .ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- pantalla de logo ---------- */
  .splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-content:center;justify-items:center;gap:22px;
    transition:opacity .45s ease;animation:splashOut .4s ease 5s forwards}
  .splash.out{opacity:0;pointer-events:none}
  .nosplash .splash{display:none}
  .splash img{width:min(46vw,230px);height:auto;animation:logoIn .8s cubic-bezier(.2,.7,.2,1) both}
  .splash p{margin:0;font:700 24px/1 var(--display);font-stretch:88%;color:var(--navy);animation:fadeIn .6s .4s both}
  @keyframes logoIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes splashOut{to{opacity:0;visibility:hidden}}

  /* ---------- estructura: menú lateral + contenido ---------- */
  .shell{min-height:100dvh}
  .nav{position:fixed;z-index:40;top:0;bottom:0;left:0;width:min(86vw,var(--nav-w));background:var(--navy);color:var(--on-navy);
    display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
    transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s;box-shadow:6px 0 24px rgba(13,19,45,.25)}
  body.nav-open .nav{transform:none;visibility:visible;transition:transform .22s ease,visibility 0s}
  body.nav-open{overflow:hidden}
  .scrim{position:fixed;inset:0;z-index:30;background:rgba(13,19,45,.55);opacity:0;pointer-events:none;transition:opacity .2s}
  body.nav-open .scrim{opacity:1;pointer-events:auto}
  body[data-auth="out"] .nav,body[data-auth="out"] .scrim,body[data-auth="out"] .topbar{display:none}

  .brand{background:#fff;color:var(--navy);display:flex;align-items:center;gap:12px;
    padding:max(16px,env(safe-area-inset-top)) 12px 16px 18px}
  .brand img{width:50px;height:auto;flex:none}
  .brand span{font:700 20px/1.1 var(--display);font-stretch:88%;flex:1;min-width:0}
  .iconbtn{width:44px;height:44px;display:grid;place-items:center;border:0;border-radius:var(--r-ctl);background:transparent;color:var(--navy);flex:none}
  .iconbtn:hover{background:#E6E9F3}
  .iconbtn .ico{width:24px;height:24px}
  .who{display:flex;align-items:center;gap:12px;padding:18px 18px 10px}
  .avatar{width:42px;height:42px;border-radius:50%;background:var(--navy-3);color:#fff;display:grid;place-items:center;font:700 16px var(--display);flex:none}
  .whotxt{min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:3px}
  .whoname{font-weight:700;color:#fff;overflow-wrap:anywhere;line-height:1.2}
  .chip{background:#fff;color:var(--navy);border-radius:99px;padding:0 10px;font-size:13px;font-weight:700;line-height:20px}
  .navlist{display:flex;flex-direction:column;gap:4px;padding:8px 12px}
  .navitem{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:0 14px;border:0;border-radius:var(--r-ctl);
    background:transparent;color:var(--on-navy);font-weight:700;text-align:left;text-decoration:none}
  .navitem .ico{width:22px;height:22px}
  .navitem:hover{background:var(--navy-2)}
  .navitem[aria-current="page"]{background:var(--navy-3);color:#fff}
  .nav :focus-visible{outline-color:#A9C4FF}
  .navmsg{margin:0 20px;font-size:14px;color:var(--on-navy-muted)}
  .navfoot{margin-top:auto;padding:16px 12px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;border-top:1px solid #29325F}
  .navfoot>.seg,.navfoot>.ver,.navfoot>.thanks{margin-inline:6px}
  .ver{font-size:13px;color:var(--on-navy-muted);line-height:1.45}
  .ver.old{color:#FFB9AE}
  .linkbtn{border:0;background:none;padding:0;color:inherit;text-decoration:underline;font-size:13px;min-height:28px}
  .ver p{margin:2px 0 0;min-height:0}
  .thanks{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--on-navy-muted);margin:0}
  .thanks .ico{margin-top:1px}

  .topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;height:calc(60px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) max(8px,env(safe-area-inset-right)) 0 max(8px,env(safe-area-inset-left));background:#fff;border-bottom:1px solid var(--line)}
  .topbar img{height:36px;width:auto;margin-left:4px}
  .topbar span{font:700 19px/1 var(--display);font-stretch:88%;color:var(--navy);margin-left:8px}

  .stage{padding:20px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left));min-width:0}
  .view{max-width:760px;margin:0 auto}
  body[data-auth="out"] .stage{min-height:100dvh;display:grid;align-content:center;padding-block:28px}

  @media (min-width:640px){
    .stage{padding-top:30px}
    .view{max-width:820px}
  }
  @media (min-width:900px){
    .shell{display:grid;grid-template-columns:var(--nav-w) minmax(0,1fr)}
    body[data-auth="out"] .shell{grid-template-columns:minmax(0,1fr)}
    .nav{position:sticky;top:0;height:100dvh;width:auto;transform:none;visibility:visible;transition:none;box-shadow:none}
    .scrim,.topbar,.navclose{display:none}
    body.nav-open{overflow:auto}
    .stage{padding:40px 48px 72px}
    .view{max-width:980px}
  }

  /* ---------- avisos de versión ---------- */
  .notice{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-bg);
    border:1px solid var(--warn-line);border-radius:var(--r-ctl);padding:10px 14px;margin:0 auto 16px;max-width:760px}
  .notice span{flex:1 1 220px;font-weight:700}
  @media (min-width:640px){.notice{max-width:820px}}
  @media (min-width:900px){.notice{max-width:980px}}

  /* ---------- cabecera de cada vista ---------- */
  .viewhead{margin:0 0 20px}
  h1{margin:0;font:700 clamp(28px,5.2vw,40px)/1.05 var(--display);font-stretch:86%;letter-spacing:-.01em;color:var(--navy);text-wrap:balance}
  h1:focus{outline:none}
  .sub{margin:8px 0 0;color:var(--muted)}

  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;list-style:none;margin:0 auto 20px;padding:0;max-width:760px}
  @media (min-width:640px){.steps{max-width:820px}}
  @media (min-width:900px){.steps{max-width:980px}}
  .steps li{border-top:4px solid var(--line);padding-top:8px;font-size:14px;font-weight:700;color:var(--muted)}
  .steps li.on,.steps li.done{border-color:var(--navy)}
  .steps li.on{color:var(--text)}

  /* ---------- hojas y formulario ---------- */
  .sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-panel);padding:20px}
  @media (min-width:640px){.sheet{padding:28px}}
  fieldset.grp{border:0;margin:0 0 30px;padding:0;min-width:0}
  fieldset.grp:last-of-type{margin-bottom:8px}
  legend{padding:0;margin:0 0 14px;font:700 21px/1.2 var(--display);font-stretch:88%;color:var(--navy)}
  .grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px 20px}
  @media (min-width:640px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .field{display:flex;flex-direction:column;gap:6px;min-width:0;margin:0}
  .grid+.field,.field+.field,.field+.grid{margin-top:16px}
  .grid>.field,.grid>.field+.field{margin-top:0}
  label,.lbl{font-weight:700;font-size:15px;line-height:1.3}
  .opt{font-weight:400;color:var(--muted);margin-left:4px}
  .inp{position:relative}
  .inp>.ico{position:absolute;left:14px;top:50%;margin-top:-10px;color:var(--muted);pointer-events:none}
  .inp.ta>.ico{top:15px;margin-top:0}
  input,textarea{width:100%;font-size:16px;background:#fff;border:1.5px solid var(--line-strong);border-radius:var(--r-ctl);padding:11px 12px 11px 46px;min-height:50px}
  textarea{min-height:140px;resize:vertical;padding-top:13px}
  input:focus-visible,textarea:focus-visible{outline:none;border-color:var(--focus);box-shadow:0 0 0 3px rgba(47,107,219,.28)}
  .field.bad input,.field.bad textarea{border-color:var(--danger);background:#FFF7F6}
  .err{color:var(--danger);font-size:14px}
  .note{font-size:14px;color:var(--muted)}

  .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:var(--r-ctl);
    border:1.5px solid var(--navy);background:#fff;color:var(--navy);font-weight:700;font-size:16px;line-height:1.2;text-decoration:none}
  .btn:hover{background:#EBEEF7}
  .btn.primary{background:var(--navy);color:#fff}
  .btn.primary:hover{background:var(--navy-2)}
  .btn.sm{min-height:42px;padding:0 16px;font-size:15px}
  .acts{display:flex;gap:8px;flex-shrink:0}
  .btn.del.armed{background:#b3261e;border-color:#b3261e;color:#fff}
  .btn[data-armed]{background:var(--danger);border-color:var(--danger);color:#fff}
  .btn:disabled{opacity:.55;cursor:default}
  .actions .primary{flex:1 1 220px}
  @media (min-width:900px){.actions .primary{flex:0 1 auto;min-width:260px}}
  .status{margin:14px 0 0;min-height:1.5em;color:var(--muted)}
  .status:empty{margin:0;min-height:0}
  .status.error{color:var(--danger);font-weight:700}
  .status a{color:var(--navy);font-weight:700}

  /* ---------- firma ---------- */
  .signgrid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:900px){.signgrid{grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;align-items:start}}
  .handoff{margin:0 0 16px}
  .sum{margin:0;display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px 16px}
  .sum dt{color:var(--muted);font-weight:700;font-size:14px;padding-top:1px}
  .sum dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}
  .sigbox{position:relative;border:1.5px solid var(--navy);border-radius:var(--r-ctl);background:#fff;touch-action:none}
  .sigbox canvas{display:block;width:100%;height:clamp(200px,34vh,300px);touch-action:none;cursor:crosshair}
  .sigbox .hint{position:absolute;left:16px;right:16px;bottom:44px;border-bottom:1.5px dashed var(--line-strong);pointer-events:none}
  .sigbox .hint span{position:absolute;left:0;top:6px;font-size:14px;color:var(--muted)}
  .padtools{display:flex;justify-content:space-between;align-items:center;gap:12px}

  /* ---------- listas (PDF guardados, usuarios) ---------- */
  ul.rows{list-style:none;margin:18px 0 0;padding:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-panel);overflow:hidden}
  ul.rows:empty{display:none}
  ul.rows li{display:flex;gap:14px;align-items:center;justify-content:space-between;padding:12px 16px}
  @media (max-width:639px){ul.rows li{flex-wrap:wrap}.acts{width:100%}.acts .btn{flex:1}}
  ul.rows li+li{border-top:1px solid var(--line)}
  .hi{min-width:0}
  .hi b{display:block;font:700 19px/1.2 var(--display);font-stretch:88%;color:var(--navy)}
  .hi span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
  .toolbar{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
  @media (min-width:640px){.toolbar{grid-template-columns:minmax(0,1fr) auto;align-items:end}}
  .toolbar .actions{margin:0}

  .okmark{width:60px;height:60px;color:var(--ok);margin-bottom:10px;stroke-width:1.6}

  /* ---------- acceso ---------- */
  .authcard{max-width:440px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px 24px}
  .authhead{text-align:center;margin-bottom:22px}
  .authhead img{height:78px;width:auto}
  .authhead h1{margin-top:14px;font-size:clamp(28px,7vw,34px)}
  .seg{--seg-line:var(--line-strong);--seg-fg:var(--text);--seg-bg:#fff;--seg-on-bg:var(--navy);--seg-on-fg:#fff;display:inline-flex;
    border:1.5px solid var(--seg-line);border-radius:var(--r-ctl);overflow:hidden;background:var(--seg-bg)}
  .seg button{border:0;background:transparent;color:var(--seg-fg);font-weight:700;font-size:14px;padding:0 14px;min-height:36px}
  .seg button+button{border-left:1.5px solid var(--seg-line)}
  .seg button[aria-pressed="true"]{background:var(--seg-on-bg);color:var(--seg-on-fg)}
  .nav .seg{--seg-line:#4B5588;--seg-fg:var(--on-navy);--seg-bg:transparent;--seg-on-bg:#fff;--seg-on-fg:var(--navy);align-self:flex-start}
  .tabs{display:flex;width:100%;margin:0 0 20px}
  .tabs button{flex:1;min-height:46px;font-size:15px;padding:0 6px}
  .authfoot{max-width:440px;margin:16px auto 0;display:flex;gap:12px 20px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .authfoot .ver{color:var(--muted)}
  .authfoot .ver.old{color:var(--danger)}

  @media (prefers-reduced-motion:reduce){
    .nav,.scrim{transition:none!important}
    .splash img,.splash p{animation:none}
    .splash{transition:none}
  }
</style>
</head>
<body data-auth="out">

<!-- pantalla de logo al abrir la app -->
<div class="splash" id="splash" aria-hidden="true">
  <img src="assets/iss-logo.png" alt="" width="600" height="523">
  <p>Extra beställning</p>
</div>

<div class="shell">

  <!-- MENÚ LATERAL -->
  <aside class="nav" id="nav" data-i18n-aria="navLabel">
    <div class="brand">

}catch(e){}
const t = k => I18N[LANG][k];
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>{ el.setAttribute('aria-label', t(el.dataset.i18nAria)); });
  $('#sig').setAttribute('aria-label', t('sigAria'));
  const hint = $('#orderHint'); if(hint) hint.hidden = !t('orderHint');
  document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.lang === LANG)));
  document.querySelectorAll('.field.bad').forEach(e=>e.classList.remove('bad'));
  document.querySelectorAll('.field .err').forEach(e=>{ e.textContent = ''; });
  $('#sigErr').textContent = '';
  ['#status','#astatus','#hstatus','#ustatus','#dstatus','#navMsg'].forEach(s=>setMsg(s,''));
  setVerMsg('');
  updateNav();
  renderVer();
  $('#scopeNote').textContent = t(isAdmin() ? 'scopeAdmin' : 'scopeUser');
  if(current && !$('#s2').hidden) renderSummary();
  if(!$('#s4').hidden) renderHistory();
  if(!$('#s5').hidden) renderUsers();
}
document.querySelectorAll('.lang button').forEach(b=>b.addEventListener('click', ()=>{
  LANG = b.dataset.lang;
  try{ localStorage.setItem(LANG_KEY, LANG); }catch(e){}
  applyLang();
}));

/* ---------- sesión y llamadas al servidor ---------- */
let session = null;      // {token, user, name, role}
try{ session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }catch(e){}
function apiUrl(){
  const u = (window.CONFIG && window.CONFIG.APPS_SCRIPT_URL) || '';
  return /^https:\/\/script\.google\.com\//.test(u) ? u : '';
}
function api(payload){
  const body = Object.assign({}, payload);
  if(session && !['login','register','admin'].includes(body.action)) body.token = session.token;
  return fetch(apiUrl(), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},   // evita el preflight CORS

/* ---------- firma ---------- */
const pad = {ctx:null, drawing:false, ink:false, dpr:1, b:null};
function resetBounds(){ pad.b = {x0:1e9,y0:1e9,x1:-1,y1:-1}; }
// keep = true: al girar el dispositivo o cambiar el tamaño de la ventana se conserva la firma ya hecha
function setupPad(keep){
  const c = $('#sig');
  if(keep && c.getBoundingClientRect().width < 100) return;   // ventana encogida un instante: no tocar la firma
  let snap = null, oldW = 0, oldH = 0;
  if(keep && pad.ink && c.width){
    snap = document.createElement('canvas'); snap.width = c.width; snap.height = c.height;
    snap.getContext('2d').drawImage(c, 0, 0);
    oldW = c.width / pad.dpr; oldH = c.height / pad.dpr;
  }
  const kept = snap ? pad.b : null;
  const r = c.getBoundingClientRect();
  pad.dpr = Math.max(1, window.devicePixelRatio || 1);
  c.width = Math.round(r.width*pad.dpr);
  c.height = Math.round(r.height*pad.dpr);
  const x = c.getContext('2d');
  x.setTransform(pad.dpr,0,0,pad.dpr,0,0);
  x.lineWidth = 2.8; x.lineCap = 'round'; x.lineJoin = 'round'; x.strokeStyle = '#0D132D';
  pad.ctx = x;
  if(snap){ x.drawImage(snap, 0, 0, oldW, oldH); pad.ink = true; pad.b = kept; }
  else{ pad.ink = false; resetBounds(); }
  $('#sigErr').textContent = '';
}
let lastW = window.innerWidth;
window.addEventListener('resize', ()=>{
  if(window.innerWidth !== lastW){ lastW = window.innerWidth; if(!$('#s2').hidden) setupPad(true); }
});
function pos(e){
  const r = $('#sig').getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
function grow(p){
  const b = pad.b;
  b.x0 = Math.min(b.x0,p.x); b.y0 = Math.min(b.y0,p.y);
  b.x1 = Math.max(b.x1,p.x); b.y1 = Math.max(b.y1,p.y);
}
(function bindPad(){
  const c = $('#sig');
  c.addEventListener('pointerdown', e=>{
    if(!pad.ctx) return;
    e.preventDefault();
    c.setPointerCapture(e.pointerId);
    pad.drawing = true;
    const p = pos(e);
    pad.ctx.beginPath(); pad.ctx.moveTo(p.x,p.y); pad.ctx.lineTo(p.x+0.01,p.y); pad.ctx.stroke();
    pad.ink = true; grow(p);
    $('#sigErr').textContent = '';
  });
  c.addEventListener('pointermove', e=>{
    if(!pad.drawing) return;
    e.preventDefault();
    const p = pos(e);
    pad.ctx.lineTo(p.x,p.y); pad.ctx.stroke();
    pad.ctx.beginPath(); pad.ctx.moveTo(p.x,p.y);
    grow(p);
  });
  const end = ()=>{ pad.drawing = false; };
  c.addEventListener('pointerup', end);
  c.addEventListener('pointercancel', end);
  c.addEventListener('pointerleave', end);
  $('#clear').addEventListener('click', ()=>setupPad(false));
})();
function signatureImage(){
  // recorta la firma a su caja de trazos
  const c = $('#sig'), b = pad.b, m = 8, d = pad.dpr;
  const x0 = Math.max(0,(b.x0-m)*d), y0 = Math.max(0,(b.y0-m)*d);
  const x1 = Math.min(c.width,(b.x1+m)*d), y1 = Math.min(c.height,(b.y1+m)*d);
  const w = Math.max(1,Math.round(x1-x0)), h = Math.max(1,Math.round(y1-y0));
  const o = document.createElement('canvas');
  o.width = w; o.height = h;
  o.getContext('2d').drawImage(c, x0, y0, w, h, 0, 0, w, h);
  return {url:o.toDataURL('image/png'), w:w, h:h};
}

/* ---------- PDF (siempre en sueco, independiente del idioma de la interfaz) ---------- */
function buildPdf(d, sig, logo){
  const jsPDF = window.jspdf.jsPDF;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const L = 18, R = 192, X = 72;
  const NAVY = [13, 19, 45];                      // azul del logo ISS
  const navy = ()=>{ doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]); doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]); };
  const black = ()=>doc.setTextColor(0,0,0);
  const grey = ()=>doc.setDrawColor(130,138,160);

  navy(); doc.setFillColor(NAVY[0],NAVY[1],NAVY[2]);
  doc.rect(0, 0, 210, 6, 'F');                    // franja superior
  if(logo){                                       // logo arriba a la derecha
    const lw = 27, lh = lw * logo.h / logo.w;
    doc.addImage(logo.url, 'PNG', R - lw, 12, lw, lh);
  }
  doc.setFont('helvetica','bold'); doc.setFontSize(26);
  doc.text('EXTRA BESTÄLLNING', L, 26);
  doc.setFont('helvetica','normal'); doc.setFontSize(10); doc.setTextColor(70,78,100);
  doc.text('Vänligen fyll i alla uppgifter tydligt. Tack!', L, 33);
  navy(); doc.setLineWidth(0.6); doc.line(L, 38, R, 38);

  let y = 50;
  const line = (label, value)=>{
    navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
    doc.text(label, L, y);
    black(); doc.setFont('helvetica','normal'); doc.setFontSize(11);
    if(value) doc.text(String(value), X, y - 0.8, {maxWidth: R - X});
    grey(); doc.setLineWidth(0.2); doc.line(X - 2, y + 1.4, R, y + 1.4);
    y += 11;
  };
  line('NAMN:', d.namn);
  line('HSA-ID:', d.hsa);
  line('TELEFON:', d.telefon);
  line('E-POST:', d.epost);
  line('AVDELNING:', d.avdelning);
  line('KOSTNADSSTÄLLE:', d.kostnadsstalle);
  line('RUMSNUMMER:', d.rumsnummer);
  line('KARMNUMMER:', d.karmnummer);

  // Beställning: caja que crece con el texto
  navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('BESTÄLLNING:', L, y + 2);
  black(); doc.setFont('helvetica','normal'); doc.setFontSize(11);
  const lines = doc.splitTextToSize(d.bestallning, R - X - 6);
  const boxH = Math.max(34, lines.length * 5.2 + 8);
  navy(); doc.setLineWidth(0.3); doc.rect(X - 2, y - 4, R - X + 2, boxH);
  black(); doc.text(lines, X + 1, y + 2);
  y += boxH + 10;

  // Underskrift
  navy(); doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('UNDERSKRIFT:', L, y);
  const maxW = 70, maxH = 22;
  const k = Math.min(maxW / sig.w, maxH / sig.h);
  const sw = sig.w * k, sh = sig.h * k;
  doc.addImage(sig.url, 'PNG', X, y + 1.4 - sh, sw, sh);
  grey(); doc.setLineWidth(0.2); doc.line(X - 2, y + 1.4, R, y + 1.4);
  if(d.ansvarig){
    black(); doc.setFont('helvetica','normal'); doc.setFontSize(9);
    doc.text(d.ansvarig, X, y + 6);
  }
  y += 13;
  line('DATUM:', d.datum);
  line('TID:', d.tid);

  navy(); doc.setLineWidth(0.6); doc.line(L, 270, R, 270);
  doc.setFont('helvetica','bold'); doc.setFontSize(9);
  doc.text('TACK FÖR ATT DU BIDRAR TILL EN REN OCH TRIVSAM MILJÖ!', L, 277);
  return doc;
}

/* ---------- nombre de archivo: iniciales + fecha ---------- */
function initials(name){
  const ini = String(name||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .split(/[\s\-]+/).filter(w=>!/^(de|del|la|las|los|y|van|von|af|da|di)$/i.test(w)).map(w=>w.replace(/[^A-Za-z]/g,'').charAt(0)).join('').toUpperCase();
  return (ini || 'XX').slice(0,4);
}

// Pide el PDF al servidor y lo muestra en una pestaña nueva
function openPdf(fileId, btn, statusSel){
  if(!apiUrl()){ setMsg(statusSel, t('eUrl'), true); return; }
  const w = window.open('', '_blank');           // se abre ya, durante el toque, para que no lo bloqueen
  if(btn) btn.disabled = true;
  setMsg(statusSel, t('loading'));
  api({action:'pdf', id:fileId}).then(res=>{
    if(btn) btn.disabled = false;
    if(!res.ok) throw res;
    const bytes = Uint8Array.from(atob(res.pdfBase64), c => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], {type:'application/pdf'}));
    if(w){ w.location.href = url; setMsg(statusSel, ''); }
    else{
      const s = $(statusSel); s.className = 'status'; s.textContent = '';
      const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = t('popup');
      s.appendChild(a);
    }
  }).catch(err=>{
    if(w) w.close();
    if(btn) btn.disabled = false;
    setMsg(statusSel, t('hErr') + errText(err), true);
  });
}

    return;
  }
  d.disabled = true;
  api({action:'delpdf', id:d.dataset.del}).then(res=>{
    if(!res.ok) throw res;
    hist = hist.filter(it=>it.id !== d.dataset.del);
    setMsg('#hstatus', t('deleted'));
    renderHistory();
  }).catch(err=>{ d.disabled = false; setMsg('#hstatus', t('hErr') + errText(err), true); });
});

/* ---------- usuarios (administrador) ---------- */
let usersData = [];
function renderUsers(){
  const ul = $('#ulist');
  if(!usersData.length){ ul.innerHTML = $('#ustatus').textContent ? '' : `<li><span class="note">${esc(t('noUsers'))}</span></li>`; return; }
  ul.innerHTML = usersData.map(u=>`<li>
    <div class="hi"><b>@${esc(u.user)}</b><span>${esc(u.name)} · ${esc(t('created'))} ${esc(u.created)}</span></div>
    <button type="button" class="btn sm" data-u="${esc(u.user)}">${esc(t('deleteBtn'))}</button></li>`).join('');
}
function loadUsers(){
  setMsg('#ustatus', t('loading')); $('#ulist').innerHTML = '';
  api({action:'users'}).then(res=>{
    if(!res.ok) throw res;
    usersData = res.items || [];
    setMsg('#ustatus','');
    renderUsers();
  }).catch(err=>{ setMsg('#ustatus', t('hErr') + errText(err), true); });
}
$('#usersBtn').addEventListener('click', ()=>{ showView('s5'); loadUsers(); });
$('#urefresh').addEventListener('click', loadUsers);
$('#ulist').addEventListener('click', e=>{
  const b = e.target.closest('button[data-u]');
  if(!b) return;
  if(!b.dataset.armed){          // primer toque: pide confirmación en el propio botón
    b.dataset.armed = '1'; b.textContent = t('confirmBtn');
    setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = t('deleteBtn'); } }, 4000);
    return;
  }
  b.disabled = true;
  api({action:'deluser', user:b.dataset.u}).then(res=>{
    if(!res.ok) throw res;
    loadUsers();
  }).catch(err=>{ b.disabled = false; setMsg('#ustatus', t('hErr') + errText(err), true); });
});

/* ---------- guardar pedido ---------- */
$('#save').addEventListener('click', ()=>{
  if(!pad.ink){ $('#sigErr').textContent = t('eSig'); return; }
  if(!$('#datum').value || !$('#tid').value){ setMsg('#status', t('eDT'), true); return; }
  if(!window.jspdf){ setMsg('#status', t('eLib'), true); return; }
  if(!apiUrl()){ setMsg('#status', t('eUrl'), true); return; }
  const d = Object.assign({}, current, {
    ansvarig: $('#ansvarig').value.trim(),
    datum: $('#datum').value,
    tid: $('#tid').value
  });
  const btn = $('#save'); btn.disabled = true;
  setMsg('#status', t('mkPdf'));
  logoReady.then(()=>{
    let payload;
    try{
      const doc = buildPdf(d, signatureImage(), getLogo());
      const b64 = doc.output('datauristring').split(',')[1];
      payload = {fields:d, fileName:fileNameFor(d), pdfBase64:b64};
    }catch(err){
      btn.disabled = false; setMsg('#status', t('ePdf') + err.message, true); return;
    }
    setMsg('#status', t('saving'));
    return api(payload).then(res=>{
      btn.disabled = false;
      if(!res.ok){ setMsg('#status', t('notSaved') + errText(res), true); return; }
      lastSavedId = res.fileId || '';
      try{ if(res.folder) localStorage.setItem(FOLDER_KEY, res.folder); }catch(e){}
      showFolderLinks();
      setMsg('#dstatus','');
      showView('s3');
    }).catch(err=>{ btn.disabled = false; setMsg('#status', errText(err), true); });
  });
});

/* ---------- instalar como app (acceso directo en móvil y escritorio) ---------- */
let deferredInstall = null;
function isStandalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function updateInstall(){ $('#installBtn').hidden = isStandalone() || !(deferredInstall || isIOS()); }
window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); deferredInstall = e; updateInstall(); });
window.addEventListener('appinstalled', ()=>{ deferredInstall = null; updateInstall(); });
$('#installBtn').addEventListener('click', ()=>{
  if(deferredInstall){
    deferredInstall.prompt();
    deferredInstall.userChoice.then(()=>{}, ()=>{}).then(()=>{ deferredInstall = null; updateInstall(); });
  }else{
    setMsg('#navMsg', t('installIos'));
  }
});
if('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}

/* ---------- versión y actualización automática ---------- */
let pendingVersion = '';
let serverVersion = '';
function currentView(){ return VIEWS.find(v=>!$('#'+v).hidden) || ''; }
// No recargar si hay algo a medias (formulario, firma, contraseña escrita o guardando)
function isBusy(){
  const v = currentView();
  if($('#save').disabled || $('#aGo').disabled) return true;
  if(v === 's2') return true;
  if(v === 's1') return !!($('#bestallning').value.trim() || $('#rumsnummer').value.trim() || $('#karmnummer').value.trim());
  if(v === 'sA') return ['a_code','a_name','a_user','a_pass','a_pass2','a_admin'].some(id=>$('#'+id).value);
  return false;
}
function goTo(url){ location.replace(url); }
function setVerMsg(msg){
  ['#verMsg','#verMsg2'].forEach(sel=>{ const el = $(sel); if(el) el.textContent = msg; });
}
function renderVer(){
  const outdated = !!serverVersion && serverVersion !== EXPECTED_SERVER;
  const txt = `${t('verApp')} v${APP_VERSION} · ${t('verSrv')} ${serverVersion ? 'v' + serverVersion : '—'}` + (outdated ? ` (${t('old')})` : '');
  $('#verText').textContent = txt; $('#verText2').textContent = txt;
  $('#ver').classList.toggle('old', outdated); $('#ver2').classList.toggle('old', outdated);
  $('#srvWarn').hidden = !(outdated && isAdmin());
  if(pendingVersion) $('#updText').textContent = t('updText') + pendingVersion;
}
function latestVersion(){
  // Lee el propio index.html sin caché y extrae APP_VERSION: una sola fuente de verdad
  const u = new URL('index.html', location.href);
  u.search = ''; u.searchParams.set('_', Date.now());
  return fetch(u.toString(), {cache:'no-store'}).then(r=>r.text()).then(txt=>{
    const m = /const APP_VERSION = '(\d[^']*)'/.exec(txt);
    return m ? m[1] : null;
  });
}
function applyUpdate(){
  if(!pendingVersion) return;
  if(new URLSearchParams(location.search).get('v') === pendingVersion){
    // ya se intentó con esta versión y el servidor aún entrega la anterior: no entrar en bucle
    setVerMsg(t('updWait'));
    return;
  }
  const u = new URL(location.href);
  u.searchParams.set('v', pendingVersion);   // URL distinta = el navegador pide el archivo nuevo, sin borrar caché
  goTo(u.toString());
}
function checkUpdate(manual){
  if(manual) setVerMsg(t('verChecking'));
  return latestVersion().then(v=>{
    if(v && v !== APP_VERSION){
      pendingVersion = v;
      $('#updbar').hidden = false;
      renderVer();
      if(!isBusy()) applyUpdate();
    }else{
      pendingVersion = ''; $('#updbar').hidden = true;
      if(manual) setVerMsg(t('verOk'));
    }
  }).catch(()=>{ if(manual) setVerMsg(t('offline')); });
}
function checkServer(){
  if(!apiUrl()) return;
  fetch(apiUrl()).then(r=>r.json()).then(j=>{ serverVersion = (j && j.version) || '0'; renderVer(); }).catch(()=>{});
}
$('#updBtn').addEventListener('click', applyUpdate);
['#verCheck','#verCheck2'].forEach(sel=>$(sel).addEventListener('click', ()=>{ checkServer(); checkUpdate(true); }));
let lastCheck = 0;
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && Date.now() - lastCheck > 60000){ lastCheck = Date.now(); checkUpdate(false); checkServer(); }
});
setInterval(()=>{ lastCheck = Date.now(); checkUpdate(false); }, 5 * 60 * 1000);

/* ---------- pantalla de logo ---------- */
(function splash(){
  const el = $('#splash'); if(!el) return;
  if(document.documentElement.classList.contains('nosplash')){ el.remove(); return; }
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hide = ()=>{ el.classList.add('out'); setTimeout(()=>el.remove(), 500); };
  const timer = setTimeout(hide, reduce ? 900 : 1800);
  el.addEventListener('click', ()=>{ clearTimeout(timer); hide(); });
})();

/* ---------- arranque ---------- */
buildForm();
setAuthMode('login');
applyLang();
if(session && session.token) enterApp(); else showView('sA');
booted = true;
renderVer();
lastCheck = Date.now(); checkUpdate(false); checkServer();
</script>
